name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project Waschanlagenmodus.xcodeproj \
            -scheme Waschanlagenmodus \
            -configuration Release \
            -derivedDataPath build \
            build

      - name: Package
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/Waschanlagenmodus.app \
            Waschanlagenmodus.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Waschanlagenmodus
          path: Waschanlagenmodus.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Waschanlagenmodus.zip --title "$GITHUB_REF_NAME" --generate-notes
